<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fondo Circular/Redondeado para Icono -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>

  <g filter="url(#shadow)" transform="translate(32, 32)">
    <!-- Grilla de Fondo (Sección Estructural) -->
    <path d="M 96 128 L 352 128 M 96 224 L 352 224 M 96 320 L 352 320" stroke="#1E293B" stroke-width="6" stroke-dasharray="12 12" />
    <path d="M 128 96 L 128 352 M 224 96 L 224 352 M 320 96 L 320 352" stroke="#1E293B" stroke-width="6" stroke-dasharray="12 12" />

    <!-- Viga Superior (Hormigón - Naranja) -->
    <rect x="80" y="100" width="288" height="48" rx="12" fill="url(#orangeGrad)" />
    
    <!-- Columnas (Estructura - Azul) -->
    <rect x="104" y="148" width="48" height="200" rx="10" fill="url(#blueGrad)" />
    <rect x="296" y="148" width="48" height="200" rx="10" fill="url(#blueGrad)" />

    <!-- Zapata / Base -->
    <rect x="80" y="348" width="96" height="20" rx="6" fill="#475569" />
    <rect x="272" y="348" width="96" height="20" rx="6" fill="#475569" />

    <!-- Cota de Dimensión / Verificación NEC (Verde Check) -->
    <circle cx="336" cy="112" r="28" fill="#10B981" />
    <path d="M 324 112 L 332 120 L 348 104" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
